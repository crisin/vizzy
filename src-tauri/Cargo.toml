[package]
name = "vizzy"
version = "0.1.0"
description = "vizzy — audio visualizer"
authors = ["chris"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vizzy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# tests/comfy_mock.rs drives the bake client against a python stand-in
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
realfft = "3"
# ComfyUI bake client (src/comfy.rs). rustls instead of native-tls so the
# build needs no OpenSSL on Windows; a local ComfyUI is plain http anyway.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# now playing via the system media session (src/nowplaying.rs); same
# version wasapi already pulls in, so no second copy gets built
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFBase", "CFDictionary"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSDictionary",
  "NSObject",
  "NSString",
  "NSValue",
] }
